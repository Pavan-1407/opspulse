services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opspulse
      POSTGRES_PASSWORD: opspulse
      POSTGRES_DB: opspulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspulse"]
      interval: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://opspulse:opspulse@db:5432/opspulse
      SEED_ON_STARTUP: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
